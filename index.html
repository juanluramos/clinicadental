<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clínica Dental Dr. Pérez Mouse</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body, html {
        height: 100%;
        margin: 0;
      }

      /* Contenedor de toda la página */
      .layout {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* contenido arriba + footer abajo */
        align-items: center;
      }

      .contenido-principal {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      footer {
        width: 100%; /* que ocupe todo el ancho */
      }
    </style>
  </head>

  <body>

    <div class="layout">

      <!-- ⭐ CONTENIDO CENTRAL -->
      <div class="contenido-principal">
        <img src="images/logo.png" alt="" width="500" class="mb-4" />

        <div class="d-grid gap-2 col-6 mx-auto">
          <button
            class="btn btn-primary btn-lg"
            type="button"
            onclick="location.href='pages/appointment.html'"
          >
            Crear cita
          </button>

          <button
            class="btn btn-primary btn-lg"
            type="button"
            onclick="location.href='pages/list.html'"
          >
            Listar citas
          </button>
        </div>
      </div>

      <!-- ⭐ FOOTER PEGADO ABAJO Y ANCHO COMPLETO -->
      <footer class="bg-dark text-white text-center py-3">
        <p class="mb-1">📍 Calle Sonrisa 25, 18001 Granada</p>
        <p class="mb-1">📞 Teléfono: 958 123 456</p>
        <p class="mb-0">✉️ Email: info@clinicadrperezmouse.com</p>
      </footer>

    </div>

  </body>
</html>
