<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listado de Citas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous"
  />
  <script src="../js/listado.js" defer></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #f8f9fa;
    }

    /* Estructura general */
    body {
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Menú lateral */
    .sidebar {
      flex: 0 0 200px;
      background-color: #f8f9fa;
      border-right: 1px solid #0dcaf0;
    }

    /* Área de contenido */
    .content-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
      overflow-y: auto;
    }

    .table-container {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 100%;
      max-width: 80%;
    }
  </style>
</head>

<body>

  <!-- 🔹 Navbar superior -->
  <nav class="navbar navbar-light bg-info p-3 mb-0 border-bottom border-info">      
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="../images/logo.png" alt="Logo" width="120">
      <span class="ms-3 text-white fs-3">Gestión de Citas</span>
    </a>
  </nav>

  <!-- 🔹 Contenido principal -->
  <div class="main-content">
    
    <!-- 🟦 Menú lateral -->
    <div class="sidebar p-3">
      <ul class="nav flex-column">
        <li class="nav-item mb-2" onclick="location.href='../index.html'">
          <a class="nav-link" href="#">Menú principal</a>
        </li>
        <li class="nav-item mb-2" onclick="location.href='./appointment.html'">
          <a class="nav-link active" href="#">Crear una cita</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Deshabilitado</a>
        </li>    
      </ul>
    </div>

    <!-- 🟩 Área central -->
    <div class="content-area">
      <div class="table-container text-center">

        <h2 class="mb-4 text-info">Listado de Citas</h2>

        <table class="table table-hover table-bordered align-middle" id="tabla-citas">
          <thead class="table-info">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Nombre</th>
              <th scope="col">Apellidos</th>
              <th scope="col">DNI</th>
              <th scope="col">Fecha cita</th>
              <th scope="col">Hora cita</th>
              <th scope="col">Teléfono</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            
         
          </tbody>
        </table>

      </div>
    </div>

  </div> <!-- main-content -->
</body>
</html>
